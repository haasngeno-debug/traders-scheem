<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vol 10 (1s) - Working</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0A101E;color:#fff;overflow-x:hidden;padding-bottom:90px}
.top{height:56px;background:#151D2E;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #1E293B;position:sticky;top:0;z-index:20}
.top-l{display:flex;align-items:center;gap:10px}
.ham{width:20px;height:2px;background:#94a3b8;box-shadow:0 6px 0 #94a3b8,0 -6px 0 #94a3b8;cursor:pointer}
.t{width:34px;height:34px;background:#FF4D5A;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;cursor:pointer}
.rbal{background:#1C2538;border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:6px;border:1px solid #243044;cursor:pointer}
.rbal .r{width:26px;height:22px;background:#3B82F6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.rbal b{color:#3B82F6;font-size:12px}
.dep{background:#3B82F6;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer}
.dep-left{background:#3B82F6;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;margin-right:8px}
.tabs{height:50px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0A101E;border-bottom:1px solid #121A2B;overflow-x:auto}
.tabs button{border:none;background:#121A2B;color:#5B6B85;font-size:13px;font-weight:600;padding:9px 14px;border-radius:20px;white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer}
.tabs .on{background:#1C2538;color:#fff;border:1px solid #2A3650}
.vol-row{padding:10px;display:flex;justify-content:space-between;align-items:flex-start}
.vol-box{background:#151D2E;border:1px solid #1E293B;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;min-width:150px;cursor:pointer}
.vol-box b{font-size:12px;display:block}
.p100{background:#151D2E;border:1px solid #1E293B;border-radius:8px;padding:8px 14px;font-size:12px;color:#94a3b8;cursor:pointer}
.chart{position:relative;width:100%;height:500px;background:#0A101E;overflow:hidden;border-top:1px solid #121A2B}
#cv{width:100%;height:100%}
.price-scale{position:absolute;right:0;top:10px;bottom:26px;width:68px;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px 10px 0;text-align:right;font-size:10px;color:#3B4A64;pointer-events:none}
.price-tag{position:absolute;right:0;background:#0A2A2A;border:1px solid #10B981;color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;transform:translateY(-50%);z-index:2}
.time-row{position:absolute;bottom:0;left:0;right:68px;height:24px;display:flex;justify-content:space-between;padding:4px 10px;font-size:10px;color:#3B4A64;border-top:1px solid #121A2B;background:#0A101E}
.zoom{position:absolute;left:10px;bottom:32px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:38px;height:38px;background:#151D2E;border:1px solid #1E293B;border-radius:12px;color:#94a3b8;font-size:20px;cursor:pointer}
.digits{height:72px;background:#0A101E;border-top:1px solid #121A2B;border-bottom:1px solid #121A2B;display:flex;align-items:center;padding:0 6px;gap:2px;overflow-x:auto}
.di{flex:1;min-width:48px;text-align:center;position:relative;padding-top:4px;cursor:pointer}
.di .circle{width:40px;height:40px;border-radius:50%;border:2px solid #1E293B;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#0F182A}
.di .circle b{font-size:13px;font-weight:800}
.di .circle.sel{border-color:#3B82F6;box-shadow:0 0 0 1px #3B82F6}
.di .tri{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #EAB308;display:none}
.di.sel .tri{display:block}
.di small.perc{font-size:9px;color:#94a3b8;margin-top:4px;display:block}
.switch{margin:12px;background:#151D2E;border-radius:12px;display:flex;overflow:hidden;height:42px;border:1px solid #1E293B}
.switch button{flex:1;border:none;background:transparent;color:#5B6B85;font-size:11px;font-weight:800;letter-spacing:1px;cursor:pointer}
.switch .on{background:#3B82F6;color:#fff}
.stake-wrap{margin:0 12px;background:#111A2E;border:1.5px solid #3B82F6;border-radius:14px;height:62px;display:flex;align-items:center;padding:0 6px;gap:8px}
.stake-wrap button{width:44px;height:44px;background:#151D2E;border:none;border-radius:10px;color:#94a3b8;font-size:18px;cursor:pointer}
.stake-mid{flex:1;text-align:center;position:relative;cursor:pointer}
.stake-mid label{font-size:9px;color:#3B82F6;letter-spacing:1px;font-weight:800;display:block}
.stake-mid b{font-size:22px;font-weight:800;display:block;margin-top:2px}
.stake-mid i{position:absolute;left:10px;top:30px;color:#3B82F6;font-style:normal;font-size:14px;font-weight:800}
.chips{display:flex;gap:6px;margin:10px 12px}
.chips span{flex:1;background:#151D2E;border:1px solid #1E293B;border-radius:8px;padding:9px 0;text-align:center;font-size:11px;color:#5B6B85;font-weight:600;cursor:pointer}
.chips .on{background:#1E2F4A;border-color:#3B82F6;color:#60A5FA}
.boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 12px}
.box{background:#151D2E;border:1px solid #1E293B;border-radius:12px;padding:12px 8px;text-align:center;position:relative;cursor:pointer}
.box label{font-size:9px;font-weight:800;letter-spacing:0.6px;display:block;margin-bottom:6px}
.box.green label{color:#22c55e}.box.red label{color:#ef4444}.box.yellow label{color:#EAB308}
.box b, .box input{font-size:14px;font-weight:800;background:transparent;border:none;color:#fff;text-align:center;width:100%}
.box input{outline:none}
.last{margin:10px 12px;background:#151D2E;border:1px solid #1E293B;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.last span{font-size:10px;color:#5B6B85;font-weight:700}
.last b{color:#10B981;font-size:15px;font-weight:800}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 14px}
.buy button{border:none;border-radius:16px;height:66px;padding:12px 14px;text-align:left;position:relative;cursor:pointer}
.buy .even{background:#10B981}.buy .odd{background:#EF4444}
.buy b{font-size:16px;font-weight:800;display:block;color:#fff}
.buy small{font-size:11px;color:rgba(255,255,255,0.7);margin-top:2px;display:block}
.buy .pr{position:absolute;right:14px;top:14px;text-align:right}
.bottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:#151D2E;border-top:1px solid #1E293B;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom div{text-align:center;color:#5B6B85;font-size:10px;font-weight:600;cursor:pointer}
.bottom .on{color:#3B82F6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:#151D2E;border:1px solid #1E293B;border-radius:16px;width:100%;max-width:340px;padding:20px}
.modal-box h3{font-size:14px;margin-bottom:12px}
.modal-box input{width:100%;background:#0A101E;border:1px solid #1E293B;border-radius:10px;padding:12px;color:#fff;font-size:14px;margin-bottom:12px}
.modal-box button{width:100%;background:#3B82F6;border:none;border-radius:10px;padding:12px;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <div class="top-l"><div class="ham" onclick="alert('Menu')"></div><div class="t">T</div><button class="dep-left" onclick="openDep()">Deposit</button></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="rbal" onclick="openDep()"><div class="r">R</div><b id="bal">$ 0.00</b><span style="font-size:10px;color:#5B6B85">▼</span></div>
    <div style="font-size:18px;color:#3B82F6;cursor:pointer" onclick="toggleSound()" id="soundBtn">🔊</div>
    <div style="font-size:20px;color:#94a3b8;cursor:pointer" onclick="alert('Notifications')">🔔</div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button onclick="switchTab(this)">◎ Matches/Differs</button>
  <button class="on" onclick="switchTab(this)">⊞ Even/Odd</button>
  <button onclick="switchTab(this)">⇅ Over/Under</button>
</div>

<div class="vol-row">
  <div class="vol-box" onclick="changeMarket()"><div style="background:#1A2538;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#3B82F6">📊</div><div><b id="volName">Vol 10 (1s)</b><small><span id="volPrice">9362.02</span> <small class="red">-1.45%</small></small></div><span style="color:#5B6B85;font-size:12px">▼</span></div>
  <div class="p100" onclick="changeZoom()">100%</div>
</div>

<div class="chart">
  <canvas id="cv"></canvas>
  <div class="price-scale"><span>9363.98</span><span>9356.82</span><span>9349.65</span><span>9342.48</span><span>9335.32</span><span>9328.15</span></div>
  <div class="price-tag" id="ptag">9362.02</div>
  <div class="time-row"><span>18:39:55</span><span>18:40:09</span><span>18:40:24</span><span>18:40:39</span><span>18:40:53</span></div>
  <div class="zoom"><button onclick="zoomIn()">+</button><button onclick="zoomOut()">−</button></div>
</div>

<div class="digits" id="digits"></div>

<div class="switch"><button class="on" id="autoB" onclick="setMode('AUTO')">AUTO</button><button id="manB" onclick="setMode('MANUAL')">MANUAL</button></div>

<div class="stake-wrap"><button onclick="changeStake(-1)">−</button><div class="stake-mid" onclick="editStake()"><label>STAKE</label><i>$</i><b id="stake">10</b></div><button onclick="changeStake(1)">+</button></div>

<div class="chips" id="chips"><span data-v="1" onclick="setChip(1)">$1</span><span data-v="5" onclick="setChip(5)">$5</span><span class="on" data-v="10" onclick="setChip(10)">$10</span><span data-v="25" onclick="setChip(25)">$25</span><span data-v="50" onclick="setChip(50)">$50</span><span data-v="100" onclick="setChip(100)">$100</span></div>

<div class="boxes">
  <div class="box green" onclick="editBox('profit')"><label>TARGET PROFIT</label><input id="inpProfit" value="200" onchange="updateProfit()"></div>
  <div class="box red" onclick="editBox('loss')"><label>STOP LOSS</label><input id="inpLoss" value="999"></div>
  <div class="box yellow" onclick="editBox('mult')"><label>MULTIPLIER</label><input id="inpMult" value="2"></div>
</div>

<div class="last"><span id="lastInfo">LAST &nbsp; 0T · 0W · 0L</span><b id="profit">+$0.00</b></div>

<div class="buy">
  <button class="even" onclick="doTrade('EVEN')"><b>Even</b><small>95.2%</small><div class="pr"><b id="pe">$19.52</b><br><small>Payout</small></div></button>
  <button class="odd" onclick="doTrade('ODD')"><b>Odd</b><small>95.2%</small><div class="pr"><b id="po">$19.52</b><br><small>Payout</small></div></button>
</div>

<div class="bottom">
  <div class="on" onclick="switchBottom(this)"><div style="font-size:22px">📊</div>Trade</div>
  <div onclick="switchBottom(this); openAI()"><div style="width:46px;height:46px;background:linear-gradient(135deg,#F59E0B,#EC4899,#8B5CF6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 2px;color:#fff">✨</div>AI</div>
  <div onclick="switchBottom(this)"><div style="font-size:22px">🕒</div>Positions</div>
</div>

<div class="modal" id="depModal">
  <div class="modal-box">
    <h3>Deposit Funds</h3>
    <input id="depInput" type="number" placeholder="Enter amount $" value="10">
    <button onclick="doDeposit()">Deposit</button>
    <button style="background:transparent;color:#94a3b8;margin-top:8px" onclick="closeDep()">Cancel</button>
  </div>
</div>

<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3>Enter Stake</h3>
    <input id="stakeInput" type="number" placeholder="$">
    <button onclick="saveStake()">Save</button>
    <button style="background:transparent;color:#94a3b8;margin-top:8px" onclick="closeStake()">Cancel</button>
  </div>
</div>

<script>
let stake=10, lastD=2, profit=0, total=0, wins=0, losses=0, autoMode=true, bal=0;
let pts=[], pr=9320;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), ptag=document.getElementById('ptag');
function resize(){cv.width=cv.offsetWidth*2;cv.height=500*2;ctx.scale(2,2);}resize();window.onresize=resize;
for(let i=0;i<160;i++){let c=Math.sin(i/5)*2 + (Math.random()-0.5)*3; if(i<20) c=4; if(i>100) c=Math.sin(i/3)*3; pr+=c; pts.push(pr);}
function draw(){
  ctx.clearRect(0,0,cv.offsetWidth,500);
  let slice=pts.slice(-110); let min=Math.min(...slice)-8, max=Math.max(...slice)+12, range=max-min;
  const W=cv.offsetWidth-68, H=450;
  ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.8; ctx.beginPath();
  slice.forEach((p,i)=>{let x=(i/(slice.length-1))*W; let y=15+H-((p-min)/range)*H*0.85; if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);});
  ctx.stroke();
  let last=slice[slice.length-1]; let yL=15+H-((last-min)/range)*H*0.85; ptag.style.top=yL+'px'; ptag.innerText=last.toFixed(2); document.getElementById('volPrice').innerText=last.toFixed(2);
}
let perc={0:11.2,1:9.2,2:8.2,3:7.4,4:8.6,5:11.8,6:11.0,7:9.0,8:12.6,9:11.0};
function renderDigits(){
  let html='';
  for(let i=0;i<10;i++){
    let sel=i===lastD?' sel':'';
    let arc=i===3?'<div style="position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid transparent;border-top-color:#ef4444;transform:rotate(-20deg)"></div>': i===8?'<div style="position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid transparent;border-top-color:#22c55e;transform:rotate(-20deg)"></div>':'';
    html+=`<div class="di${sel}" onclick="pickDigit(${i})"><div class="circle ${i===lastD?'sel':''}">${arc}<b>${i}</b></div><div class="tri" style="${i===lastD?'display:block':''}"></div><small class="perc">${perc[i].toFixed(1)}%</small></div>`;
  }
  document.getElementById('digits').innerHTML=html;
}
function tick(){
  let ch=(Math.random()-0.5)*3; let last=pts[pts.length-1]+ch; pts.push(last); if(pts.length>250) pts.shift();
  lastD=Math.abs(Math.floor(last))%10; renderDigits(); draw();
}
setInterval(tick,800);

function updPay(){let p=(stake*1.952).toFixed(2); document.getElementById('pe').innerText='$'+p; document.getElementById('po').innerText='$'+p;}
function setChip(v){stake=v; document.getElementById('stake').innerText=stake; document.querySelectorAll('#chips span').forEach(s=>s.classList.toggle('on', parseInt(s.dataset.v)===v)); updPay();}
function changeStake(d){stake=Math.max(1, stake+d); document.getElementById('stake').innerText=stake; updPay(); document.querySelectorAll('#chips span').forEach(s=>s.classList.remove('on'));}
function editStake(){document.getElementById('stakeInput').value=stake; document.getElementById('stakeModal').classList.add('open');}
function saveStake(){let v=parseInt(document.getElementById('stakeInput').value); if(v){stake=v; document.getElementById('stake').innerText=stake; updPay();} closeStake();}
function closeStake(){document.getElementById('stakeModal').classList.remove('open');}
function openDep(){document.getElementById('depModal').classList.add('open');}
function closeDep(){document.getElementById('depModal').classList.remove('open');}
function doDeposit(){let v=parseFloat(document.getElementById('depInput').value); if(v>0){bal+=v; document.getElementById('bal').innerText='$ '+bal.toFixed(2); closeDep();}}
function setMode(m){autoMode=m==='AUTO'; document.getElementById('autoB').className=autoMode?'on':''; document.getElementById('manB').className=!autoMode?'on':'';}
function doTrade(dir){
  if(bal>0 && stake>bal){alert('Low balance, deposit more'); return;}
  let win=(dir==='EVEN'&&lastD%2===0)||(dir==='ODD'&&lastD%2===1);
  total++; if(win){wins++; profit+=stake*0.952; if(bal>0) bal+=stake*0.952;} else {losses++; profit-=stake; if(bal>0) bal-=stake;}
  document.getElementById('bal').innerText='$ '+bal.toFixed(2);
  document.getElementById('profit').innerText=(profit>=0?'+$':'-$')+Math.abs(profit).toFixed(2);
  document.getElementById('profit').style.color=profit>=0?'#10B981':'#ef4444';
  document.getElementById('lastInfo').innerText=`LAST  ${total}T · ${wins}W · ${losses}L`;
  if(autoMode && total<20){setTimeout(()=>doTrade(Math.random()>0.5?'EVEN':'ODD'), 2000);}
}
function switchTab(el){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on')); el.classList.add('on');}
function switchBottom(el){document.querySelectorAll('.bottom div').forEach(b=>b.classList.remove('on')); el.classList.add('on');}
function pickDigit(i){lastD=i; renderDigits();}
function changeMarket(){let m=prompt('Enter Market name:', document.getElementById('volName').innerText); if(m) document.getElementById('volName').innerText=m;}
function changeZoom(){let z=prompt('Zoom %:', '100');}
function editBox(type){document.getElementById('inp'+(type==='profit'?'Profit':type==='loss'?'Loss':'Mult')).focus();}
function toggleSound(){let b=document.getElementById('soundBtn'); b.innerText=b.innerText==='🔊'?'🔇':'🔊';}
function openAI(){alert('AI Scanner: Best entry is '+(lastD%2===0?'Even':'Odd')+' with 78% accuracy');}
function zoomIn(){}
function zoomOut(){}
renderDigits(); draw(); updPay();
</script>
</body>
  </html>
