<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07101e">
<title>Create Account | Traders Scheem</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #f7f9ff;
  background:
    radial-gradient(ellipse at top, #172d50 0%, #07101e 55%, #040914 100%);
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 6%;
  border-bottom: 1px solid #263d59;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.2;
}

.logo span {
  color: #f5c94b;
}

.nav-link {
  color: #f5c94b;
  border: 1px solid #b68d29;
  border-radius: 10px;
  padding: 12px 18px;
  text-decoration: none;
  font-weight: bold;
}

main {
  padding: 42px 16px;
}

.heading {
  text-align: center;
  margin: 0 auto 28px;
  animation: enter 1s ease both;
}

.heading h1 {
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 800;
  margin-bottom: 14px;
}

.heading h1 span {
  display: inline-block;
  background: linear-gradient(
    90deg, #f5c94b, #fff1a8, #38d5f4, #f5c94b
  );
  background-size: 300% auto;
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  animation: shine 4s linear infinite, float 3s ease-in-out infinite;
}

.heading p {
  color: #aebed4;
  line-height: 1.7;
}

.card {
  max-width: 520px;
  margin: auto;
  padding: 28px;
  border: 1px solid #344c6a;
  border-radius: 18px;
  background: rgba(8, 20, 38, .94);
  box-shadow: 0 18px 60px #0006;
  animation: enter 1.2s ease both;
}

.field {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 9px;
  font-size: 14px;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  border: 1px solid #3c5575;
  background: #091629;
  color: white;
  font-size: 15px;
  outline: none;
  transition: .25s;
}

input::placeholder {
  color: #8295af;
}

input:focus {
  border-color: #38d5f4;
  box-shadow: 0 0 0 3px #38d5f41b;
}

.password-input {
  padding-right: 65px;
}

.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  background: transparent;
  border: none;
  color: #38d5f4;
  cursor: pointer;
  padding: 6px;
}

.hint {
  color: #91a6c1;
  font-size: 12px;
  margin-top: 8px;
}

.continue {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 17px;
  background: linear-gradient(100deg, #e9b936, #ffe17b);
  color: #171403;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  transition: .25s;
}

.continue:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px #f5c94b35;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
}

.terms {
  margin-top: 20px;
  text-align: center;
  color: #9eafc7;
  font-size: 12px;
  line-height: 1.8;
}

.terms a {
  color: #38d5f4;
}

footer {
  text-align: center;
  padding: 24px 15px;
  border-top: 1px solid #1c3048;
  color: #8295af;
  font-size: 12px;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes shine {
  from { background-position: 0% center; }
  to { background-position: 300% center; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@media (max-width: 480px) {
  header { padding: 16px; }
  .logo { font-size: 21px; }
  main { padding: 34px 14px; }
  .card { padding: 22px 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Traders <span>Scheem</span></div>
  <a class="nav-link" href="login.html">Log In</a>
</header>

<main>
  <section class="heading">
    <h1>Create Your <span>Account</span></h1>
    <p>Join Traders Scheem and start your trading journey.</p>
    <p>It only takes a few minutes.</p>
  </section>

  <form class="card" id="signupForm">

    <div class="field">
      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        name="fullName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        minlength="2"
        required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required>
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        placeholder="e.g. +254712345678"
        autocomplete="tel"
        required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          class="password-input"
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          minlength="4"
          autocomplete="new-password"
          required>
        <button class="toggle" type="button"
          data-target="password">Show</button>
      </div>
      <p class="hint">Password must be at least 4 characters.</p>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-wrap">
        <input
          class="password-input"
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
          required>
        <button class="toggle" type="button"
          data-target="confirmPassword">Show</button>
      </div>
    </div>

    <button class="continue" type="submit">
      CONTINUE →
    </button>

    <p class="message" id="message"
       role="status" aria-live="polite"></p>

    <p class="terms">
      By creating an account, you agree to our
      <a href="terms.html">Terms and Conditions</a>
      and <a href="privacy.html">Privacy Policy</a>.
    </p>

  </form>
</main>

<footer>
  © 2026 Traders Scheem. All rights reserved.
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://blyqbosfgdrqqavlijdam.supabase.co";
const SUPABASE_KEY = "sb_publishable_mHYfGhz-2CC5pXGq166hZg_KQaNEeJ4";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("signupForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const message = document.getElementById("message");

function checkPasswords() {
  confirmPassword.setCustomValidity(
    confirmPassword.value !== "" &&
    confirmPassword.value !== password.value
      ? "Passwords do not match."
      : ""
  );
}

password.addEventListener("input", checkPasswords);
confirmPassword.addEventListener("input", checkPasswords);

document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    button.textContent = show ? "Hide" : "Show";
  });
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  checkPasswords();

  if (!form.reportValidity()) return;

  message.style.color = "#ff8b8b";
  message.textContent = "Creating your account...";

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password.value,
      options: {
        data: {
          full_name: fullName,
          phone: phone
        }
      }
    });

    if (error) throw error;

    message.style.color = "#f5c94b";
    message.textContent = data.session
      ? "Account created! You can now log in."
      : "Registration received! Check your email to confirm your account.";
  } catch (error) {
    message.style.color = "#ff8b8b";
    message.textContent = error.message ||
      "Registration failed. Please try again.";
  }
});
</script>


</body>
</html>
