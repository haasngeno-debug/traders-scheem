<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
</head>
<body>
  <h1>Forgot your password?</h1>

  <p>Enter your email address and we will send you a reset link.</p>

  <form id="forgotForm">
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <button id="sendButton" type="submit">
      Send reset link
    </button>
  </form>

  <p id="message"></p>

  <a href="login.html">Back to login</a>

  <script>
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      message.textContent = "";

      try {
        const response = await fetch(
          "https://traderscheem-backend-pkn6.onrender.com/api/auth/forgot-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Could not send the reset email."
          );
        }

        message.style.color = "green";
        message.textContent =
          "If this email is registered, a password reset link has been sent.";

      } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
      }

      sendButton.disabled = false;
      sendButton.textContent = "Send reset link";
    });
  </script>
</body>
  </html>
