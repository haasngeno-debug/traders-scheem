
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#041020">
  <title>Login | HassanFX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top, #123052 0%, transparent 45%),
        #041020;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      border: 1px solid #243b56;
      border-radius: 20px;
      background: rgba(9, 24, 43, 0.97);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      margin-bottom: 12px;
      color: #00d9a0;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ffffff;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 27px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #a8bad0;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce7f5;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30465f;
      border-radius: 10px;
      outline: none;
      background: #071527;
      color: #ffffff;
      font-size: 15px;
    }

    input:focus {
      border-color: #00d9a0;
      box-shadow: 0 0 0 3px rgba(0, 217, 160, 0.12);
    }

    .forgot-container {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 18px;
    }

    .forgot-link {
      font-size: 13px;
      color: #00d9a0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      margin-top: 4px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00d9a0;
      color: #041020;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #00efb1;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 24px;
      color: #a8bad0;
      font-size: 14px;
      line-height: 2;
      text-align: center;
    }

    a {
      color: #00d9a0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      color: #72859c;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">Hassan<span>FX</span></div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Log in to your account to continue to your trading dashboard.
    </p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="forgot-container">
        <button
          type="button"
          class="forgot-link"
          id="forgotBtn"
        >
          Forgot password?
        </button>
      </div>

      <button class="login-btn" id="loginBtn" type="submit">
        LOGIN →
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

    <div class="footer">
      © 2026 HassanFX. All rights reserved.
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const forgotBtn = document.getElementById("forgotBtn");
    const loginBtn = document.getElementById("loginBtn");

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
    }

    forgotBtn.addEventListener("click", function() {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage(
          "Please enter your email address first.",
          "#ff7777"
        );
        return;
      }

      showMessage(
        "Password recovery is not connected yet. Please contact support.",
        "#ffcc66"
      );
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage(
          "Please enter your email and password.",
          "#ff7777"
        );
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "PLEASE WAIT...";

      showMessage(
        "Opening dashboard...",
        "#00d9a0"
      );

      setTimeout(function() {
        window.location.href = "loading.html";
      }, 500);
    });
  </script>
</body>
</html>
