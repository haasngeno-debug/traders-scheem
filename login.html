
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#041020">
  <title>Login | HassanFX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top, #123052 0%, transparent 45%),
        #041020;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      border: 1px solid #243b56;
      border-radius: 20px;
      background: rgba(9, 24, 43, 0.97);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      margin-bottom: 12px;
      color: #00d9a0;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ffffff;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 27px;
      text-align: center;
      animation: floatText 2.5s ease-in-out infinite;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #a8bad0;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce7f5;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30465f;
      border-radius: 10px;
      outline: none;
      background: #071527;
      color: #ffffff;
      font-size: 15px;
    }

    input:focus {
      border-color: #00d9a0;
      box-shadow: 0 0 0 3px rgba(0, 217, 160, 0.12);
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00d9a0;
      color: #041020;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #00efb1;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 24px;
      color: #a8bad0;
      font-size: 14px;
      line-height: 2;
      text-align: center;
    }

    a {
      color: #00d9a0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      color: #72859c;
      font-size: 12px;
      text-align: center;
    }

    @keyframes floatText {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">Hassan<span>FX</span></div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Log in to your account to continue to your trading dashboard.
    </p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="login-btn" type="submit">
        LOGIN →
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

    <div class="footer">
      © 2026 HassanFX. All rights reserved.
    </div>
  </main>

  <!-- Load Supabase JavaScript once -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Your Supabase project settings
    const SUPABASE_URL =
      "https://blyqbosfgdrqqavljdam.supabase.co";

    // This must be your actual Supabase publishable key
    const SUPABASE_KEY =
      "sb_publishable_mHYfGhz-2CC5pXGq166hZg_KQaNEeJ4";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = form.querySelector(".login-btn");

    function showMessage(text, color) {
      message.textContent = text;
      message.style.color = color;
    }

    let supabaseClient = null;

    try {
      if (!window.supabase) {
        throw new Error("Supabase library did not load.");
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    } catch (error) {
      console.error("Supabase setup error:", error);
      showMessage(
        "Setup error. Check your Supabase URL, key, and internet connection.",
        "#ff7777"
      );
      button.disabled = true;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!supabaseClient) {
        showMessage("Supabase is not connected. Check the setup.", "#ff7777");
        return;
      }

      if (!navigator.onLine) {
        showMessage("You are offline. Check your internet connection.", "#ffbf69");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "#ff7777");
        return;
      }

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      showMessage("Connecting securely...", "#a8bad0");

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error("Login session was not created.");
        }

        showMessage(
          "Login successful! Opening dashboard...",
          "#00d9a0"
        );

        window.location.href = "dashboard.html";

      } catch (error) {
        console.error("Login error:", error);

        const errorMessage = (error.message || "").toLowerCase();

        if (
          errorMessage.includes("invalid login credentials")
        ) {
          showMessage(
            "Incorrect email or password. Please try again.",
            "#ff7777"
          );
        } else if (
          errorMessage.includes("email not confirmed")
        ) {
          showMessage(
            "Please confirm your email before logging in.",
            "#ffbf69"
          );
        } else if (
          errorMessage.includes("failed to fetch") ||
          errorMessage.includes("network") ||
          errorMessage.includes("load failed")
        ) {
          showMessage(
            "Connection failed. Check your internet and Supabase project URL.",
            "#ff7777"
          );
        } else {
          showMessage(
            "Login failed: " + (error.message || "Please try again."),
            "#ff7777"
          );
        }
      } finally {
        button.disabled = false;
        button.textContent = "LOGIN →";
      }
    });
  </script>
</body>
</html>
